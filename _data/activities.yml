- date: 2026-10-05
  type: Visit
  title: Online Research Discussion with Prof. Chenhui Chu, Kyoto University
  place: Online meeting
  description: >-
    Joined an online meeting between FILKOM UB and Prof. Chenhui Chu of Kyoto University to discuss
    research developments and opportunities for collaboration. Presented the three benchmarks built
    from NusaCrowd (NusaNLU, NusaNLG, and NusaASR) and ParaCotta, a paraphrase corpus method
    published at PACLIC 2021. The discussion supports FILKOM UB's research on Visual Scene-aware Machine Translation.
  photos:
    - /assets/img/activity/photos/kyoto-2026-1.jpg
  link: https://filkom.ub.ac.id/2026/10/09/perkuat-jejaring-riset-internasional-filkom-ub-jajaki-kolaborasi-dengan-kyoto-university/
  link_text: Read on FILKOM UB

