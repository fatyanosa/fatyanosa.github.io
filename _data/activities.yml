- date: 2026-10-22
  date_text: 21–22 Oct 2026
  type: Workshop
  title: Artificial Intelligence Digital Talent Tutor, Workshop 2 AITF 2026 (UB Batch 2)
  place: Auditorium Algoritma, FILKOM, Universitas Brawijaya, Malang
  description: >-
    Served as an Artificial Intelligence Digital Talent Tutor for students at Workshop 2 of the
    Artificial Intelligence Talent Factory (AITF) program, Batch 2, held by the Ministry of
    Communication and Digital Affairs (Komdigi) with Universitas Brawijaya. The students' task
