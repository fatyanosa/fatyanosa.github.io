- date: 2026-10-30
  type: Exhibition
  title: Exhibition at Living Lab Summit, Bestari Saintek
  place: Universitas Brawijaya
  description: >-
    Contributed to Bestari Saintek and exhibited our work at the Living Lab Summit.
    The exhibition is a collaboration with the Early Childhood Teacher Education Program
    (Program Studi Pendidikan Guru PAUD, PG-PAUD), Universitas Negeri Semarang (UNNES),
    under the Faculty of Education and Psychology (Fakultas Ilmu Pendidikan dan Psikologi, FIPP),
    on building an **Immersive Room for understanding disasters for Early Childhood**.
  photos:
    - /assets/img/activity/bestari-saintek-2026-1.png
    - /assets/img/activity/bestari-saintek-2026-2.png

- date: 2026-11-06
  date_text: 3–6 Nov 2026
  type: Certification
  title: Competency Assessor Training and Certification (BNSP)
  place: Laboratorium TIK, Universitas Brawijaya, Malang
  description: >-
    Completed the Competency Assessor Training (*Pelatihan Asesor Kompetensi*, Workplace Assessor)
    organized by LSP Entrepreneur Digital Indonesia in collaboration with the Indonesian
    Professional Certification Authority (BNSP), 3–6 November 2026. The training covered four
    competency units (48 hours in total), including planning assessment activities and processes,
    conducting assessments, and contributing to assessment validation.
  photos:
    - /assets/img/activity/bnsp-assessor-2026-group.jpg
    - /assets/img/activity/bnsp-assessor-2026-certificate.jpg
    - /assets/img/activity/bnsp-assessor-2026-units.jpg

