  date_text: 14–18 Sep 2026
  type: Visit
  title: Research Visit to The University of Osaka (DOKAR Program)
  place: SANKEN and other campuses, The University of Osaka, Japan
  description: >-
    Visited The University of Osaka together with Dr. Eng. Irawati Nurmala Sari through the
    Program Dosen Berkarya (DOKAR) of Universitas Brawijaya, as a follow-up to the Implementation
