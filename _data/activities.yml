- date: 2024-07-22
  date_text: 22–23 Jul 2024
  type: Moderator
  title: 'Moderator and Committee, ICOMIT 2024 (3rd International Conference on Multidisciplinary Applications of Information Technology)'
  place: Semarang, Indonesia
  description: >-
    Served as a moderator and as a committee member of the 2024 3rd International Conference on
    Multidisciplinary Applications of Information Technology (ICOMIT 2024). I moderated the keynote by
    Achmad Basuki, S.T., MMG., Ph.D. (Universitas Brawijaya), "IDREN: The Evolving Research & Education Network
    in Indonesia". IDREN, the Indonesia Research and Education Network, is a dedicated network infrastructure
    that connects research and education institutions and communities across Indonesia. The talk covered how
    IDREN has grown in recent years, its role in supporting research and education collaboration, and the
    challenges and opportunities in developing the network further.
  thumbs_wide: true
